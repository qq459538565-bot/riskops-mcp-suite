<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuantCalc-JS 鈥?Embeddable DCF Valuation, Portfolio Risk &amp; Kelly Calculator Widget</title>
  <meta name="description" content="Zero-dependency interactive JavaScript financial calculator widget featuring 5x5 DCF sensitivity matrix, Bull/Base/Bear scenarios, Sharpe/Sortino/VaR portfolio analytics, Kelly Criterion &amp; Loan/IRR solver." />
  <style>
    :root{--bg:#070b14;--panel:#0e1628;--panel2:#131f38;--border:#1f2e4d;--text:#e6edf7;--muted:#93a4c3;--accent:#38bdf8;--green:#10b981;}
    *{box-sizing:border-box;}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;background:radial-gradient(circle at top right,#162040 0%,var(--bg) 55%);color:var(--text);padding:24px 16px 56px;}
    .wrap{max-width:980px;margin:0 auto;}
    .qc-root{background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:22px;}
    .qc-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:16px;}
    .qc-title{font-size:19px;font-weight:800;}
    .qc-sub{font-size:12px;color:var(--muted);}
    .qc-tabs{display:flex;gap:8px;flex-wrap:wrap;}
    .qc-tab{background:var(--panel2);color:var(--muted);border:1px solid var(--border);padding:8px 13px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;}
    .qc-tab.active{color:#fff;border-color:var(--accent);background:#17294a;}
    .qc-hide{display:none;}
    .qc-inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:16px;}
    .qc-inputs label{display:flex;flex-direction:column;gap:5px;font-size:11.5px;color:var(--muted);font-weight:600;}
    .qc-inputs input{background:#09101f;color:#fff;border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-size:13.5px;}
    .qc-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px;}
    .qc-card{background:#09101f;border:1px solid var(--border);border-radius:12px;padding:13px;}
    .qc-card.qc-accent{border-color:var(--accent);box-shadow:0 0 0 1px rgba(56,189,248,.25);}
    .qc-card .k{font-size:11px;text-transform:uppercase;color:var(--muted);}
    .qc-card .v{font-size:20px;font-weight:800;margin-top:4px;}
    .qc-tbl-wrap{overflow-x:auto;}
    .qc-tbl{width:100%;border-collapse:collapse;font-size:13px;}
    .qc-tbl th,.qc-tbl td{border:1px solid var(--border);padding:8px;text-align:center;}
    .qc-tbl th{background:#09101f;color:var(--muted);font-size:11.5px;}
    .qc-tbl td.qc-hl{background:rgba(56,189,248,.2);color:#fff;font-weight:800;}
    .qc-err{color:#f87171;font-size:13px;padding:10px;background:rgba(239,68,68,.12);border-radius:8px;}
    .qc-note{margin-top:16px;padding-top:12px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);}
  </style>
</head>
<body>
  <div class="wrap">
    <div id="quant-mount"></div>
  </div>
  <script type="module">
    import { mountQuantWidget } from './quantWidget.mjs';
    mountQuantWidget(document.getElementById('quant-mount'), { currency: '$', defaultTab: 'dcf' });
  </script>
  <script src="../assets/monetization-config.js" defer></script>
</body>
</html>
